  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xyra</title>
  <link rel="icon" type="images/x-icon" href="logo.png">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <header>
    <img src="rohit.png" class="xyra-img">
    <h1 onclick="showHome()">Xyra</h1>
    <input type="search" id="search" placeholder="Search products...">
    <button onclick="showCart()" class="products-btn1">🛒 View Cart (<span id='cartCount'>0</span>)</button>
    <button onclick="showFavourites()" class="products-btn2">Favourites</button>
  </header>

  <main id="product-list">
    <span class="fav-icon" onclick="toggleFavourite(PRODUCT_ID)">
    &#9829;
  </span>
  </main>
  <section class="details-page" id="details-page"></section>

  <section id="cartPage">
    <h2 style="color: darkblue;">Your Cart</h2>
    <div id="cart-items"></div>
    <div id="cart-total" class="cart-total">Total ₹0.00</div>
    <div style="display:flex; gap:10px;">
      <button id="btn-buy" class="btn" disabled>Buy Now</button>
      <button id="btn-clear-cart" class="btn btn-clear">Clear Cart</button>
      <button class="btn" onclick="showHome()">Back to Shop</button>
    </div>
  </section>

  <!-- Add somewhere in your HTML -->
<section id="orderForm" style="display:none; max-width:600px; margin:auto; background:darkblue; padding:20px; border-radius:8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); position: relative; top: 12px;">
  <h2>Place your order</h2>
  <form id="orderFormElement">
    <input type="text" name="name" placeholder="Your Name" required style="width:100%; padding:10px; margin-bottom:10px;">
    <input type="email" name="email" placeholder="Email" required style="width:100%; padding:10px; margin-bottom:10px;">
    <input type="text" name="address" placeholder="Shipping Address" required style="width:100%; padding:10px; margin-bottom:10px;">
    <button type="submit" class="btn" style="background-color: darkviolet;">Submit Order</button>
  </form>
</section>




<section id="orderSuccess" style="display:none; text-align:center; padding:40px; font-size:24px; color:purple;">
  <div id="confettiAnimation"></div>
  <p>🎉 Your order has been placed successfully! 🎉</p>
</section>

<!-- Stylish Footer Start -->
<footer style="background: #1a237e; color: white; padding: 30px 20px; text-align: center; border-radius: 20px 20px 20px 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin-top: 40px;">
  <div style="max-width: 1200px; margin: auto;">
    <h2 style="margin-bottom: 15px; font-weight: bold;">Xyra</h2>
    <p style="font-size: 16px; margin: 8px 0;">© 2025 Xyra. All rights reserved.</p>
    <p style="font-size: 14px; color: #c5cae9; margin: 8px 0;">
      Follow us on 
      <a href="#" style="color: #7986cb; text-decoration: none; margin: 0 8px;">Facebook</a> |
      <a href="#" style="color: #7986cb; text-decoration: none; margin: 0 8px;">Twitter</a> |
      <a href="#" style="color: #7986cb; text-decoration: none; margin: 0 8px;">Instagram</a>
    </p>
    <p style="font-size: 13px; color: #9fa8da; margin-top: 15px;">
      Designed with ❤️ by Xyra Team
    </p>
  </div>
</footer>
<!-- Stylish Footer End -->

<!-- Login/Signup Modal -->
<div id="loginModal" style="display:none; position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9999;background:rgba(0,0,64,0.85);display:flex;align-items:center;justify-content:center;">
  <div style="background:white;color:black;padding:28px 30px;border-radius:12px;min-width:320px;box-shadow:0 6px 30px #000a; position:relative;">
    <h2 style="color:darkblue;">Login / Sign Up</h2>
    <form id="loginForm">
      <input type="email" id="loginEmail" style="width:100%;padding:8px;margin:10px 0;" placeholder="Email" required>
      <input type="password" id="loginPass" style="width:100%;padding:8px;margin:10px 0;" placeholder="Password" required>
      <button type="submit" style="background:darkblue;color:white;padding:8px 16px;border:none;border-radius:6px;width:100%;margin:10px 0 0;">Login</button>
    </form>
    <div style="margin:10px 0;text-align:center;" id="switchToSignup">Or <span style="color:blue;cursor:pointer;text-decoration:underline;">Sign up</span></div>
    <form id="signupForm" style="display:none;">
      <input type="email" id="signupEmail" style="width:100%;padding:8px;margin:10px 0;" placeholder="Email" required>
      <input type="password" id="signupPass" style="width:100%;padding:8px;margin:10px 0;" placeholder="Password" required>
      <button type="submit" style="background:darkblue;color:white;padding:8px 16px;border:none;border-radius:6px;width:100%;margin:10px 0 0;">Sign Up</button>
      <div style="margin:10px 0;text-align:center;" id="switchToLogin">Already have an account? <span style="color:blue;cursor:pointer;text-decoration:underline;">Login</span></div>
    </form>
    <button onclick="closeLoginModal()" 
style="position:absolute; top:10px; right:10px;
background:darkblue;color:white;border:none;
padding:6px 12px;border-radius:8px;cursor:pointer;">X</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
